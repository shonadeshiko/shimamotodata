name: Ingest GSI Elevation Data

# 国土地理院の標高タイルを取得しCOG化する。ネットワーク依存で時間もかかるため
# 毎回のpushでは実行せず、手動実行(workflow_dispatch)のみとし、
# 結果はリポジトリにコミットして固定データとして配信する。
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GDAL system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Install Python deps
        run: |
          pip install -r pipeline/requirements.txt

      - name: Run elevation ingestion
        run: |
          python pipeline/process/ingest_gsi_elevation.py

      - name: Commit and push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/rasters/gsi_elevation.tif data/processed/catalog.json
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: 標高データ(GSI標高タイル)を更新"
          git pull --rebase origin main
          git push
